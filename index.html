<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agendamento</title>
<style>
  :root { --cor: #c2185b; --fundo: #fdf6f8; --texto: #2b2b2b; --cinza: #7a7a7a; --borda: #ecd5dd; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--fundo); color: var(--texto); }
  main { max-width: 480px; margin: 0 auto; padding: 28px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; text-align: center; }
  .sub { text-align: center; color: var(--cinza); margin: 0 0 24px; }
  section { background: #fff; border: 1px solid var(--borda); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
  .oculto { display: none; }
  h2 { font-size: 1rem; margin: 0 0 12px; }
  h2 span { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--cor); color: #fff; font-size: .8rem; margin-right: 6px; }
  .lista { display: grid; gap: 8px; }
  .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 8px; }
  button.op { border: 1px solid var(--borda); background: #fff; color: var(--texto); border-radius: 12px; padding: 12px; font: inherit; text-align: left; cursor: pointer; }
  .grade button.op { text-align: center; padding: 10px 6px; }
  button.op small { display: block; color: var(--cinza); font-size: .82rem; margin-top: 2px; }
  button.op.sel { background: var(--cor); border-color: var(--cor); color: #fff; }
  button.op.sel small { color: #fde4ec; }
  label { display: block; font-size: .9rem; margin-bottom: 4px; }
  input { width: 100%; padding: 12px; border: 1px solid var(--borda); border-radius: 12px; font: inherit; margin-bottom: 12px; }
  .btn { display: block; width: 100%; padding: 14px; border: 0; border-radius: 12px; background: var(--cor); color: #fff; font: inherit; font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; }
  .btn:disabled { opacity: .5; cursor: default; }
  .msg { color: var(--cinza); font-size: .92rem; margin: 0; }
  .erro { color: #b00020; font-size: .92rem; margin: 8px 0 0; }
  .resumo { background: var(--fundo); border-radius: 12px; padding: 12px; margin-bottom: 12px; font-size: .95rem; line-height: 1.5; }
  .ok { text-align: center; }
  .ok .icone { font-size: 2.4rem; }
</style>
</head>
<body>
<main>
  <h1 id="titulo">Agendamento</h1>
  <p class="sub">Escolha o procedimento, o dia e o horário</p>

  <p id="carregando" class="msg" style="text-align:center">Carregando…</p>

  <section id="s-proc" class="oculto">
    <h2><span>1</span>Procedimento</h2>
    <div id="procs" class="lista"></div>
  </section>

  <section id="s-data" class="oculto">
    <h2><span>2</span>Dia</h2>
    <div id="dias" class="grade"></div>
  </section>

  <section id="s-hora" class="oculto">
    <h2><span>3</span>Horário</h2>
    <div id="horas" class="grade"></div>
  </section>

  <section id="s-dados" class="oculto">
    <h2><span>4</span>Seus dados</h2>
    <div id="resumo" class="resumo"></div>
    <label for="nome">Nome</label>
    <input id="nome" autocomplete="name" maxlength="60">
    <label for="tel">WhatsApp com DDD</label>
    <input id="tel" type="tel" inputmode="numeric" autocomplete="tel" placeholder="(11) 99999-9999" maxlength="16">
    <button id="confirmar" class="btn" type="button">Confirmar agendamento</button>
    <p id="erro" class="erro"></p>
  </section>

  <section id="s-ok" class="oculto ok">
    <div class="icone">✅</div>
    <h2>Agendado!</h2>
    <div id="resumo-ok" class="resumo"></div>
    <a id="zap" class="btn" target="_blank" rel="noopener">Avisar o salão no WhatsApp</a>
  </section>
</main>

<script>
  // Cole aqui a URL da implantação do Apps Script (termina em /exec)
  const API = 'https://script.google.com/macros/s/AKfycbzS1-Wc7tDkZNH1cc07LkigUE2f2g6IfvgFVJY1i0_EsbPkJGv1MN0Vl7io_6Fun8_t/exec';

  const SEMANA = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
  const est = { proc: null, data: null, hora: null };
  let cfg, pedidoAtual = 0;
  const $ = id => document.getElementById(id);

  async function chamar(params) {
    const r = await fetch(API + '?' + new URLSearchParams(params));
    const j = await r.json();
    if (j.erro) throw new Error(j.erro);
    return j;
  }

  function mostrar(id, sim) { $(id).classList.toggle('oculto', !sim); }

  function duracao(m) {
    const h = Math.floor(m / 60), r = m % 60;
    if (!h) return r + 'min';
    return h + 'h' + (r ? String(r).padStart(2, '0') : '');
  }

  function dataBonita(s) {
    const [a, m, d] = s.split('-').map(Number);
    return SEMANA[new Date(a, m - 1, d).getDay()] + ', ' + String(d).padStart(2, '0') + '/' + String(m).padStart(2, '0');
  }

  function botao(titulo, sub, aoClicar) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'op';
    b.textContent = titulo;
    if (sub) { const s = document.createElement('small'); s.textContent = sub; b.append(s); }
    b.onclick = () => {
      [...b.parentNode.children].forEach(x => x.classList.remove('sel'));
      b.classList.add('sel');
      aoClicar();
    };
    return b;
  }

  function msg(alvo, texto) {
    const p = document.createElement('p');
    p.className = 'msg';
    p.textContent = texto;
    alvo.replaceChildren(p);
  }

  function rolarPara(id) { $(id).scrollIntoView({ behavior: 'smooth', block: 'start' }); }

  function textoResumo() {
    return `${est.proc.nome} (${duracao(est.proc.duracao)}${est.proc.preco ? ' · ' + est.proc.preco : ''})\n${dataBonita(est.data)} às ${est.hora}`;
  }

  // ---------- passos ----------
  function escolherProc(p) {
    est.proc = p; est.data = null; est.hora = null;
    const dias = $('dias');
    dias.replaceChildren();
    if (!cfg.dias.length) msg(dias, 'Não há dias disponíveis no momento.');
    cfg.dias.forEach(d => dias.append(botao(dataBonita(d), '', () => escolherData(d))));
    mostrar('s-data', true); mostrar('s-hora', false); mostrar('s-dados', false);
    rolarPara('s-data');
  }

  async function escolherData(d) {
    est.data = d; est.hora = null;
    const horas = $('horas');
    const meu = ++pedidoAtual;
    msg(horas, 'Buscando horários livres…');
    mostrar('s-hora', true); mostrar('s-dados', false);
    rolarPara('s-hora');
    try {
      const { horarios } = await chamar({ acao: 'horarios', data: d, proc: est.proc.id });
      if (meu !== pedidoAtual) return;
      horas.replaceChildren();
      if (!horarios.length) return msg(horas, 'Sem horários livres nesse dia. Tente outro dia.');
      horarios.forEach(h => horas.append(botao(h, '', () => escolherHora(h))));
    } catch (e) {
      if (meu === pedidoAtual) msg(horas, 'Não foi possível carregar os horários. Tente de novo.');
    }
  }

  function escolherHora(h) {
    est.hora = h;
    $('resumo').innerText = textoResumo();
    $('erro').textContent = '';
    mostrar('s-dados', true);
    rolarPara('s-dados');
  }

  $('confirmar').onclick = async () => {
    const nome = $('nome').value.trim();
    const tel = $('tel').value.replace(/\D/g, '');
    $('erro').textContent = '';
    if (nome.length < 2) return $('erro').textContent = 'Informe seu nome.';
    if (tel.length < 10) return $('erro').textContent = 'Informe seu WhatsApp com DDD.';

    const btn = $('confirmar');
    btn.disabled = true; btn.textContent = 'Agendando…';
    try {
      await chamar({ acao: 'agendar', proc: est.proc.id, data: est.data, hora: est.hora, nome, tel });
      const resumo = textoResumo();
      $('resumo-ok').innerText = resumo;
      const texto = `Olá! Acabei de agendar pelo link:\n${resumo}\nNome: ${nome}`;
      $('zap').href = `https://wa.me/${cfg.whatsapp}?text=${encodeURIComponent(texto)}`;
      ['s-proc', 's-data', 's-hora', 's-dados'].forEach(id => mostrar(id, false));
      mostrar('s-ok', true);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (e) {
      $('erro').textContent = e.message || 'Não foi possível agendar. Tente de novo.';
      if (/ocupado/i.test(e.message)) escolherData(est.data);
    } finally {
      btn.disabled = false; btn.textContent = 'Confirmar agendamento';
    }
  };

  // ---------- início ----------
  (async () => {
    try {
      cfg = await chamar({ acao: 'config' });
      document.title = 'Agendamento · ' + cfg.nomeSalao;
      $('titulo').textContent = cfg.nomeSalao;
      cfg.procedimentos.forEach(p =>
        $('procs').append(botao(p.nome, duracao(p.duracao) + (p.preco ? ' · ' + p.preco : ''), () => escolherProc(p)))
      );
      $('carregando').remove();
      mostrar('s-proc', true);
    } catch (e) {
      $('carregando').textContent = 'Não foi possível carregar a agenda. Tente novamente mais tarde.';
    }
  })();
</script>
</body>
</html>
